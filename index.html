<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Mod Link Installer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <article class="mod-card">

      <div class="logo-container">
        <img class="mod-logo" alt="" loading="lazy" hidden>
      </div>

      <h1 class="mod-name">Loading...</h1>
      <p class="mod-developers"></p>

      <div class="card-actions">
        <button type="button" class="uri-button" disabled>Open in Geometry Dash</button>
        <button type="button" class="geode-button" disabled>Open on Geode Site</button>
      </div>

    </article>
  </main>

  <script src="main.js"></script>

</body>
</html>
